dataset_key: 13b70480-bd69-11dd-b15f-b8a03c50a862
country: MG
family_key: 4342  # Formicidae — the dataset also contains non-ant bycatch
min_specimens_per_genus: 10
views_priority: [p, d]
castes: [worker]
image_max_px: 1024
test_fraction: 0.2
seed: 42
embed_model: hf-hub:imageomics/bioclip-2  # open_clip name; ViT-L/14, 768-d
embed_batch_size: 16
probe_C: 1.0          # LogisticRegression inverse regularisation (07_eval.py)
probe_max_iter: 5000
umap_n_neighbors: 15   # 08_umap.py (random_state = seed)
umap_min_dist: 0.1
province_aliases:      # 09_geo.py — old/colonial spellings -> current province name
  Majunga: Mahajanga
  Toliary: Toliara
  Diego-Suarez: Antsiranana
api_cors_origins:      # api/main.py — browser origins allowed to call the API
  - http://localhost:3000
  - http://localhost:3001   # Next picks 3001 when 3000 is busy (dev box)
api_max_upload_mb: 10
api_geo_max_points: 1000   # GET /geo/{genus} coordinate cap (seeded subsample)
