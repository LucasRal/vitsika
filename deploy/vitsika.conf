# /etc/nginx/sites-available/vitsika.conf
# vitsika.lucas-ralambo.com -> Next.js (:3050) and FastAPI under /api (:8050).
# certbot --nginx adds the 443 server block and the 80 -> 443 redirect.

# WebSocket upgrade only when the client asks for it (Next.js HMR is dev-only,
# but this keeps the block correct if it is ever proxied).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name vitsika.lucas-ralambo.com;

    access_log /var/log/nginx/vitsika.access.log;
    error_log  /var/log/nginx/vitsika.error.log;

    # uploads: the API itself rejects > 10 MB with a JSON 413; nginx allows a
    # little more so that answer (not nginx's HTML page) is what clients see
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ---- API: /api/<x> -> http://127.0.0.1:8050/<x>  (trailing slashes on
    # both sides strip the prefix; uvicorn runs with --root-path /api so the
    # URLs it generates put it back)
    location /api/ {
        proxy_pass http://127.0.0.1:8050/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Prefix /api;
        # ~1 s per /analyze on CPU; generous ceiling for a busy box
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # stream uploads straight through instead of buffering 10 MB to disk
        proxy_request_buffering off;
    }

    # ---- site
    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # Next.js immutable build assets: let browsers cache them for a year
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3050;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
